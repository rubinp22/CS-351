<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Spinning Star (spinystar.html)</title>
<style>
  canvas { width: 512px; height: 512px; background-color: black; }
</style>

<script id="vertex-shader" type="x-shader/x-vertex">#version 300 es
precision mediump float;

uniform float N;
uniform float t;  
out vec4 vColor;

void main() {
    const float PI = 3.14159265;
    if (gl_VertexID == 0) {
        gl_Position = vec4(0.0, 0.0, 0.0, 1.0);
        vColor = vec4(1.0, 1.0, 0.0, 1.0);
    } else {
        float angle = 2.0 * PI * float(gl_VertexID - 1) / N + t;
        float r = (mod(float(gl_VertexID - 1), 2.0) < 1.0) ? 0.4 : 1.0;
        vec2 pos = vec2(r * cos(angle), r * sin(angle));
        gl_Position = vec4(pos, 0.0, 1.0);
        vColor = vec4(1.0, 0.0, 0.0, 1.0);
    }
}
</script>

<script id="fragment-shader" type="x-shader/x-fragment">#version 300 es
precision mediump float;
in vec4 vColor;
out vec4 fragColor;
void main() {
    fragColor = vColor;
}
</script>

<script>
window.onload = function() {
    const canvas = document.querySelector('canvas');
    const gl = canvas.getContext('webgl2');

    function createShader(gl, type, source) {
        const shader = gl.createShader(type);
        gl.shaderSource(shader, source);
        gl.compileShader(shader);
        return shader;
    }
    function createProgram(gl, vs, fs) {
        const program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);
        return program;
    }

    const vsSource = document.getElementById("vertex-shader").textContent;
    const fsSource = document.getElementById("fragment-shader").textContent;
    const vertexShader = createShader(gl, gl.VERTEX_SHADER, vsSource);
    const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fsSource);
    const program = createProgram(gl, vertexShader, fragmentShader);
    gl.useProgram(program);

    const N = 14.0;
    const Nloc = gl.getUniformLocation(program, "N");
    gl.uniform1f(Nloc, N);

    const tLoc = gl.getUniformLocation(program, "t");

    gl.clearColor(0.0, 0.0, 0.0, 1.0);

    let t = 0;

    function render() {
        t += 0.01;
        gl.uniform1f(tLoc, t);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.drawArrays(gl.TRIANGLE_FAN, 0, N + 2);
        requestAnimationFrame(render);
    }
    requestAnimationFrame(render);
};
</script>
</head>
<body>
    <canvas width="512" height="512"></canvas>
</body>
</html>
